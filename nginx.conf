resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 300m;

  location /amber/ {
    set $amber ${AMBER_UPSTREAM};
    rewrite ^/amber/(.*)$ /$1 break;
    proxy_pass $amber;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
  }

  location /api/ {
    set $firms ${FIRMS_UPSTREAM};
    proxy_pass $firms;
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
    proxy_request_buffering off;
    proxy_buffering off;
  }

  location = /science {
    absolute_redirect off;
    return 301 /science/;
  }

  location /science/ {
    set $science ${FIRMS_UPSTREAM};
    rewrite ^/science/(.*)$ /$1 break;
    proxy_pass $science;
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
    proxy_request_buffering off;
    proxy_buffering off;
  }

  location /context/ {
    set $context ${CONTEXT_UPSTREAM};
    rewrite ^/context/(.*)$ /$1 break;
    proxy_pass $context;
    proxy_set_header Host $host;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
